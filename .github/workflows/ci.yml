name: CI

# Only on a pull request. main is only ever reached by squash-merging one
# whose run passed on its own branch, so running again there says nothing new
# and costs a full run.
on:
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 October
    # 2026: the runner a run happens on is then a decision made here, and changed
    # deliberately, rather than one that changes under the build on a date.
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # In a job of its own, which the scenarios wait on, so that a run which
      # fails on a lint error says so without first waiting on a browser or a
      # database.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The scenarios, in four shards side by side, each on a runner of its own
  # with a Postgres of its own and a quarter of the suite to run. A shard that
  # fails does not stop the others, so that a run names every scenario that
  # failed rather than only those in the first shard to.
  tests:
    needs: build
    # Pinned, as the build's is.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Postgres, from the same compose.yaml a developer uses. Each @postgres
      # scenario makes a database of its own on it.
      - run: npm run db:up

      # Everything but the @browser scenarios, so no browser is installed.
      # Two workers rather than the six scripts/cucumber.mjs asks for: the runner has
      # two cores, and workers beyond them only wait their turn for one.
      - run: npm run test:nobrowser -- --parallel 2 --shard ${{ matrix.shard }}/4

      - if: always()
        run: npm run db:down

  # The @browser scenarios in the feature files this pull request has changed,
  # and none of the others. All of them take about an hour and a half of runner
  # time, nearly all of what a full run costs, and most pull requests touch
  # nothing they check, so every one running them all would make every one wait
  # for them. browser.yml runs the whole lot each Australian night, which is what catches
  # a change under src/web with no feature file beside it.
  #
  # A pull request that changes no browser feature finds that out first, before
  # anything is installed, and the job is over in seconds.
  browser:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The history, so that what the pull request changed can be told
          # from what main already had.
          fetch-depth: 0

      # Names are passed on NUL-separated: features here are under folders
      # called {year} and (home), and a shell splitting on spaces or expanding
      # braces would split them wrongly.
      - id: changed
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git diff -z --name-only --diff-filter=d "$BASE...HEAD" -- '*.feature' \
            | xargs -0 -r grep -l -Z -F '@browser' > "$RUNNER_TEMP/browser-features" || true
          if [ -s "$RUNNER_TEMP/browser-features" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            tr '\0' '\n' < "$RUNNER_TEMP/browser-features"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No feature file with @browser scenarios has changed, so there is nothing to run."
          fi

      - if: steps.changed.outputs.any == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - if: steps.changed.outputs.any == 'true'
        run: npm ci

      # Chromium and only Chromium: a second engine is a second download on
      # every run, and wants a reason (SETUP.md §8.2).
      - if: steps.changed.outputs.any == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.changed.outputs.any == 'true'
        run: npm run db:up

      # Two workers, for the same reason as in the tests job. Not test:browser:
      # its profile names every feature, and a path given on the command line is
      # added to those and does not replace them, so naming files to it would
      # still run every browser scenario there is.
      - if: steps.changed.outputs.any == 'true'
        run: |
          mapfile -d '' -t features < "$RUNNER_TEMP/browser-features"
          npm run test:browser:changed -- --parallel 2 "${features[@]}"

      - if: always() && steps.changed.outputs.any == 'true'
        run: npm run db:down
