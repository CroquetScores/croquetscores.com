name: CI

# Only on a pull request. main is only ever reached by squash-merging one
# whose run passed on its own branch, so running again there says nothing new
# and costs a full run.
on:
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 October
    # 2026: the runner a run happens on is then a decision made here, and changed
    # deliberately, rather than one that changes under the build on a date.
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # In a job of its own, which the scenarios wait on, so that a run which
      # fails on a lint error says so without first waiting on a browser or a
      # database.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Every scenario, @browser ones included, in eight shards side by side, each
  # on a runner of its own with a Postgres of its own and an eighth of the
  # suite to run. Running all of them is what a pull request is for: main is
  # reached only by squash-merging one whose run passed, so nothing is run again
  # there, and a change under src/web with no feature file beside it is seen
  # before it is merged and not found after. All of the
  # scenarios are about an hour and three quarters of runner time (the @browser
  # ones nearly all of it), which eight shards bring to a quarter of an hour or
  # so each, with the runner's setup besides.
  #
  # A shard that fails does not stop the others, so that a run names every
  # scenario that failed rather than only those in the first shard to.
  tests:
    needs: build
    # Pinned, as the build's is.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Chromium and only Chromium: a second engine is a second download on
      # every run, and wants a reason (SETUP.md §8.2). Every shard installs it,
      # since the @browser scenarios are spread across all of them.
      - run: npx playwright install --with-deps chromium

      # Postgres, from the same compose.yaml a developer uses. Each @postgres
      # scenario makes a database of its own on it.
      - run: npm run db:up

      # Two workers rather than the six scripts/cucumber.mjs asks for: the runner
      # has two cores, and workers beyond them only wait their turn for one.
      # test:features and not test, which runs it through a second npm run, so
      # that what follows the -- reaches Cucumber.
      - run: npm run test:features -- --parallel 2 --shard ${{ matrix.shard }}/8

      - if: always()
        run: npm run db:down
