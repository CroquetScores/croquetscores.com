name: CI

# Only on a pull request. main is only ever reached by squash-merging one
# whose run passed on its own branch, so running again there says nothing new
# and costs a full run.
on:
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 October
    # 2026: the runner a run happens on is then a decision made here, and changed
    # deliberately, rather than one that changes under the build on a date.
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # In a job of its own, which the scenarios wait on, so that a run which
      # fails on a lint error says so without first waiting on a browser or a
      # database.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The scenarios, in four shards side by side, each on a runner of its own
  # with a Postgres of its own and a quarter of the suite to run. A shard that
  # fails does not stop the others, so that a run names every scenario that
  # failed rather than only those in the first shard to.
  tests:
    needs: build
    # Pinned, as the build's is.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Which browser build Playwright wants is fixed by the version of
      # playwright-core, so that is what the cache is keyed on. Keyed on the
      # whole of package-lock.json, any change to any dependency would throw
      # away a browser that had not changed.
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser the @browser scenarios drive. Only Chromium: a second engine
      # is a second download on every run, and wants a reason. Run whether or
      # not the cache held the browser, because --with-deps also installs the
      # system packages Chromium needs, which live outside the cache; with the
      # browser already there, those are all it has left to do.
      - run: npx playwright install --with-deps chromium

      # Postgres, from the same compose.yaml a developer uses. Each @postgres
      # scenario makes a database of its own on it.
      - run: npm run db:up

      # Two workers rather than the six cucumber.mjs asks for: the runner has
      # two cores, and workers beyond them only wait their turn for one. Asked
      # of test:features rather than test, because test runs it through a
      # second npm run, and npm keeps what follows the -- for itself.
      - run: npm run test:features -- --parallel 2 --shard ${{ matrix.shard }}/4

      - if: always()
        run: npm run db:down
