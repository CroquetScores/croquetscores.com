# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      # Run full test suite on PRs, skip on main
      RUN_TESTS: ${{ github.ref != 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      # Node + npm caching
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Cache Playwright browsers (massive speedup)
      - if: env.RUN_TESTS == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # Install only Chromium (fastest + smallest)
      - if: env.RUN_TESTS == 'true'
        run: npx playwright install --with-deps chromium

      # Fast checks before expensive DB + Playwright
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Bring up isolated DB per scenario
      - if: env.RUN_TESTS == 'true'
        run: npm run db:up

      # Run full suite with deterministic parallelism
      - if: env.RUN_TESTS == 'true'
        run: npm run test:features -- --parallel 2

      # Always tear down DB even if tests fail
      - if: always() && env.RUN_TESTS == 'true'
        run: npm run db:down

      # Upload cucumber report even on failure
      - if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: reports/cucumber.html
