# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Whether the scenarios are run. Not on main: it is only ever reached by
  # squash-merging a pull request whose scenarios passed on its own branch,
  # so running them again there says nothing new and costs a full run.
  RUN_TESTS: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job A: Build (lint, typecheck, build)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Ahead of the browser and the database, so that a run which fails on a
      # lint error says so without first waiting on either.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Job B: Full test suite (browser + db), sharded
  # ---------------------------------------------------------------------------
  tests:
    needs: build
    if: env.RUN_TESTS == 'true'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      # Which browser build Playwright wants is fixed by the version of
      # playwright-core, so that is what the cache is keyed on.
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium only: a second engine is a second download on every run.
      - run: npx playwright install --with-deps chromium

      # Postgres, from the same compose.yaml a developer uses. Each scenario
      # already creates a unique database, so each shard can safely run the
      # full suite without contention.
      - run: npm run db:up

      # Two workers rather than the six cucumber.mjs asks for: the runner has
      # two cores, and workers beyond them only wait their turn for one.
      # Sharded across four runners: each shard runs a quarter of the suite.
      - run: npm run test:features -- --parallel 2 --shard ${{ matrix.shard }}/4

      - if: always()
        run: npm run db:down

      # Kept whether or not the run passed: a failure is what the HTML report is
      # most wanted for, and the timing and summary are how one run's time is
      # set against the next.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report-shard-${{ matrix.shard }}
          path: |
            reports/cucumber.html
            reports/cucumber-timing.txt
            reports/cucumber-summary.txt
