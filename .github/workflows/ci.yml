name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 19 October
    # 2026: the runner a run happens on is then a decision made here, and changed
    # deliberately, rather than one that changes under the build on a date.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # The browser the @browser scenarios drive. Only Chromium: a second engine
      # is a second download on every run, and wants a reason.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:up
      - run: npm test
      - if: always()
        run: npm run db:down
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: reports/cucumber.html
