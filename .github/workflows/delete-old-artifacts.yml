name: "Delete old artifacts"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # every hour

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    # Deleting an artifact is the only thing this job does, and it takes write
    # access to actions and nothing else, so the token is given no more.
    permissions:
      actions: write
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 1day # Setting this to 0 will delete all artifacts
