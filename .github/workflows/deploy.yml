name: Deploy

# Started by hand, from the Actions page or `gh workflow run deploy.yml`, and
# not by a merge: a deploy is a decision, and the migration it runs cannot be
# undone. It deploys the branch it is run on, which is main unless another is
# chosen in "Use workflow from". The production environment below only lets
# main read the key (deploying.md §8), so another branch is refused there and
# not here; a branch is put up from the administrator's computer instead
# (`npm run deploy`).
on:
  workflow_dispatch:

# One deploy at a time, and the one running is never cancelled for a newer
# run: a deploy stopped half way is the state deploying.md §5 is about. GitHub
# keeps one run waiting, and cancels an older one that is waiting when another
# is started.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    # A deploy that hangs would otherwise hold the concurrency group above for
    # GitHub's default six hours, and every merge after it would wait. The
    # build on the server takes minutes.
    timeout-minutes: 20

    # The secrets belong to this environment, which is where a rule such as
    # "only main" or "wait for a person to approve" is set in GitHub.
    environment: production

    permissions:
      contents: read

    steps:
      # The key can run the deploy script on the server and nothing else
      # (deploying.md §8), so a leaked one deploys a commit of this repository
      # and does no more. The server's own key is pinned, and not asked for with
      # ssh-keyscan, which would trust whatever answered.
      - name: Prepare ssh
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          # Before anything is deployed, so that a missing variable does not
          # show as a red run for a deploy that went well.
          test -n "$SITE_ADDRESS" || { echo "The variable SITE_ADDRESS is not set in the production environment."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          COMMIT: ${{ github.sha }}
        # Named, because a step without a shell is run by `bash -e`, which has no
        # pipefail: the pipe to tee would then end with tee's status and a deploy
        # that failed would show as green.
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "deploy@$DEPLOY_HOST" "$COMMIT" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # The script on the server is the one installed by hand, so a commit that
      # changes it deploys with the old one. The script says so in a line of its
      # log, which nobody reads in a green run, so it is made a warning on the
      # run's page.
      - name: Say if the installed script is out of date
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/deploy.log" ] && grep -q '^deploy: WARNING' "$RUNNER_TEMP/deploy.log"; then
            echo "::warning title=Deploy script out of date::The deploy script installed on the server differs from scripts/deploy.sh in this commit. Install it again (deploying.md section 8)."
          fi

      # The site seen from outside, through the proxy and the certificate,
      # which the check on the server (127.0.0.1) cannot see.
      - name: Look at the site
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$SITE_ADDRESS/api/site/health"
