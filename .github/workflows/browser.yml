name: Browser scenarios

# Every @browser scenario, when asked and not otherwise. A pull request runs
# all of them already, in shards (ci.yml), and nothing is run on a merge to
# main, so this is not on a schedule either: it was, each Australian night, to
# catch two pull requests that each passed alone and do not together, and a
# scenario that fails only now and then. That is what is given up. Run it from
# here on main to see how main stands, or on a branch for all of them in one
# job.
on:
  # From the Actions page or `gh workflow run browser.yml`, on whichever branch
  # is chosen.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04

    # A run that hangs would hold a runner for GitHub's default six hours. The
    # whole suite took two hours and three minutes the first time, on a runner
    # of two cores, in one job and not in shards because it is run for a look at
    # main and not to unblock a merge, which ci.yml's shards are for. Four hours
    # leaves room for the suite to double, and for a slow runner, without a run
    # that has hung holding one all night.
    timeout-minutes: 240

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run db:up

      - run: npm run test:browser -- --parallel 2

      - if: always()
        run: npm run db:down
