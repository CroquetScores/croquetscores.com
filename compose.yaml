# The name Docker Desktop shows the group by. Without it, it is the name of the
# folder this is in, which is croquetscorescom here and is different in every
# checkout that is not called the same.
name: croquet_scores_development

services:
  postgres:
    image: postgres:18-alpine
    # Fixed, so that Docker Desktop, docker ps and a person all call it one
    # thing. The cost is that a second checkout cannot bring up its own: it
    # would clash on the name as it already does on port 5432. Stop one before
    # starting the other.
    container_name: croquet_scores_development
    environment:
      POSTGRES_DB: croquet_scores_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Nothing written here is kept past npm run db:down, so none of it is worth
    # waiting on the disk for. Making and dropping a database for every
    # @postgres scenario is mostly that waiting: with these off, dropping one
    # went from 256 milliseconds to 48 and the database scenarios from eleven
    # minutes to nine. What is given up is surviving a crash of the machine or
    # of Docker, after which the database may be unreadable and is made again
    # with db:down and db:up.
    command:
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

# Named, not left to be worked out from the folder, which is where
# croquetscorescom_default came from and which changes with the checkout.
networks:
  default:
    name: croquet_scores_development
